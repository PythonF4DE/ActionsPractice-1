name: Lint multiple Languages
on:
  push:
jobs:

  yaml-lint:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'config/')

    steps:
      - uses: actions/checkout@v5

      - name: Use yamllint
        run: |
          sudo apt-get install yamllint -y
          yamllint ./config

  python-lint:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'pythonlint/')

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Use flake8
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8
          flake8 ./pythonlint

  node-lint:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, './nodelint')

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 18.19.1

      - name: Use eslint
        run: |
          npm install eslint --save-dev
          npx eslint ./nodelint

