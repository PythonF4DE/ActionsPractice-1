name: Update README with last run time

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Update timestamp in README
        run: |
          TS="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          if grep -q '^Last workflow run:' README.md; then
            sed -i "s/^Last workflow run:.*/Last workflow run: ${TS}/" README.md
          else
            echo "" >> README.md
            echo "Last workflow run: ${TS}" >> README.md
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes to commit."
            exit 0
          fi

          git commit -m "chore: update README timestamp"
          git push